<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tesia · Contact</title>
<meta name="description" content="仲璟生醫 tesia Cell Therapeutic Inc. · LINE / WhatsApp / WeChat">
<meta name="theme-color" content="#20454A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Lora:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--c316:#20454A;--c316d:#183539;--cream:#F6F3EC;--c465:#B89072;--mint:#99C8B3;--ink:#20454A;--muted:#5d7477}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--c316);min-height:100%}
body{font-family:'Noto Sans TC',system-ui,-apple-system,'PingFang TC',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{position:relative;overflow:hidden;color:#fff;padding:44px 24px 34px}
header .bg{position:absolute;right:-70px;top:-40px;width:260px;height:260px;opacity:.09;fill:#fff}
.lock{display:flex;align-items:center;gap:10px}
.lock svg{width:44px;height:44px;fill:#fff;flex:none}
.wm{font-family:Lora,serif;font-style:italic;font-weight:700;font-size:22px;line-height:1}
.wm small{display:block;font-family:Lora,serif;font-style:italic;font-weight:700;font-size:12px;line-height:1.2;margin-top:3px;opacity:.9}
.who{margin-top:38px}
.who h1{font-size:28px;font-weight:700;letter-spacing:.08em}
.who .en{font-size:15px;font-weight:400;letter-spacing:.04em;margin-top:2px;opacity:.92}
.who .ti{margin-top:12px;font-size:14px;color:var(--mint);letter-spacing:.06em}
main{flex:1;background:var(--cream);border-radius:22px 22px 0 0;padding:28px 20px 24px}
.lbl{font-size:12px;letter-spacing:.18em;color:var(--c465);font-weight:500;margin:0 4px 12px}
.btn{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid #e4dfd3;border-radius:16px;padding:14px 16px;margin-bottom:12px;text-decoration:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.985)}
.btn:hover{box-shadow:0 4px 14px rgba(32,69,74,.10)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:26px;height:26px;fill:#fff}
.line .ic{background:#06C755}.wa .ic{background:#25D366}.wc .ic{background:#07C160}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:17px;font-weight:700}
.tx span{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:9px;height:9px;border-right:2px solid #b7c2c3;border-top:2px solid #b7c2c3;transform:rotate(45deg);margin-right:4px;flex:none}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.mini a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;padding:12px 4px;border-radius:14px;background:rgba(32,69,74,.06)}
.mini svg{width:22px;height:22px;fill:none;stroke:var(--c316);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
footer{background:var(--cream);text-align:center;padding:4px 20px 28px;font-size:12px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink);font-weight:500}
/* WeChat sheet */
.myqr{position:absolute;right:16px;top:16px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 12px 7px 9px;font:inherit;font-size:13px;cursor:pointer}
.myqr svg{width:18px;height:18px}
.big{width:min(78vw,300px);height:min(78vw,300px);margin:18px auto 10px;background:#fff;border-radius:16px;padding:12px;border:1px solid #e4dfd3}
.big svg{width:100%;height:100%;display:block}
.sheet{position:fixed;inset:0;background:rgba(14,30,32,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.card{width:100%;max-width:440px;background:var(--cream);border-radius:22px 22px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{font-size:18px;margin-bottom:4px}
.card p{font-size:13px;color:var(--muted);line-height:1.7}
.qr{width:220px;height:220px;margin:16px auto;background:#fff;border-radius:14px;padding:10px;display:grid;place-items:center;border:1px solid #e4dfd3}
.qr img,.qr svg{width:100%;height:100%;object-fit:contain;display:block}.qr svg path{fill:#000}
.qr .ph{font-size:13px;color:#9aa7a8;line-height:1.6}
.idrow{display:flex;gap:8px;justify-content:center;align-items:center;margin:4px 0 16px;font-size:15px}
.idrow code{font-family:inherit;font-weight:700;background:#fff;border:1px solid #e4dfd3;border-radius:8px;padding:6px 10px}
.pill{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
.pill.p{background:var(--c316);color:#fff}.pill.s{background:rgba(32,69,74,.08);color:var(--ink)}
.acts{display:flex;gap:10px;justify-content:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--c316d);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
</style>
</head>
